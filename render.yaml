databases:
  - name: medscribe-db
    plan: free
    databaseName: medscribe
    user: medscribe

services:
  - type: web
    name: medscribe-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOW_SIGNUP
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: DATABASE_URL
        fromDatabase:
          name: medscribe-db
          property: connectionString
      - key: CARENOTE_AI_MODEL
        value: claude-sonnet-4-6
