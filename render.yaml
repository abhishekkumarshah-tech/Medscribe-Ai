databases:
  - name: medscribe-db
    plan: free
    databaseName: medscribe
    user: medscribe

services:
  - type: web
    name: medscribe-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medscribe-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false  # optional — leave unset to use the offline mock AI drafting mode
