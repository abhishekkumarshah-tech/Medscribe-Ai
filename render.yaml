databases:
  - name: medscribe-db
    plan: free
    databaseName: medscribe
    user: medscribe

services:
  - type: web
    name: medscribe-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medscribe-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false  # set manually to your Vercel URL, e.g. https://your-app.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false  # optional — leave unset to use the offline mock AI drafting mode
